# SPDX-License-Identifier: MIT

description: |
  Open Directional DPI v1 8-octant directional sensitivity input processor.
  Processes paired INPUT_REL_X and INPUT_REL_Y events using 360-degree circular
  interpolation and sub-count remainder accumulation.

compatible: "zmk,input-processor-directional-dpi"

include: ip_zero_param.yaml

properties:
  base-dpi:
    type: int
    default: 800
    description: Default base CPI/DPI for the optical sensor.

  global-gain-q8-8:
    type: int
    default: 256
    description: Default global scalar gain in Q8.8 (256 = 1.00x).

  multipliers-q8-8:
    type: array
    default: [256, 256, 256, 256, 256, 256, 256, 256]
    description: |
      Eight directional sensitivity multipliers in Q8.8 fixed-point (256 = 1.00x),
      ordered counter-clockwise in screen octants:
      [E (0), SE (45), S (90), SW (135), W (180), NW (225), N (270), NE (315)].
